name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes the Android command-line tools.
      # Do not run setup-android@v3: its legacy "sdkmanager tools" install fails
      # because that obsolete package is no longer published.
      - name: Accept Android SDK licenses and install build packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build arm64 APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-ghost-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
