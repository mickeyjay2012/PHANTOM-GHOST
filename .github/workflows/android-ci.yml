name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Supabase publishable keys are intended for client-side use; RLS protects user data.
      SUPABASE_URL: https://nkvkgnhmearznzwkabev.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_EvBlg8MRsZr_cNXMrzHv1A_maivtDLK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu GitHub-hosted runners already provide the Android SDK and
      # command-line tools. Cache per-user SDK metadata/licence state here;
      # gradle/actions/setup-gradle below manages the Gradle user-home cache.
      - name: Cache Android SDK user state
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-user-state-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            android-user-state-${{ runner.os }}-

      - name: Accept SDK licences and install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      # This action caches ~/.gradle, including dependency and build caches.
      - name: Set up Gradle and restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate pinned offline TTS assets
        run: python3 scripts/generate_tts_assets.py

      - name: Run debug unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-ghost-apks-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
